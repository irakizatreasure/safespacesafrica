services:
  - type: web
    name: safespacesafrica
    runtime: python
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1"
    healthCheckPath: /api/health
    envVars:
      - key: SISP_ENV
        value: production
      - key: SISP_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SISP_ADMIN_EMAIL
        sync: false
      - key: SISP_ADMIN_PASSWORD
        sync: false
